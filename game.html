<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#0b1210">
        <title>WARD 7</title>
        <link rel="stylesheet" href="css/reset.css">
    </head>
    <body class="page page-game" data-page="game">
        <div id="stage" class="stage">
            <canvas id="scene" class="scene"></canvas>
            <div id="hotspots" class="hotspot-layer"></div>

            <div id="overlays" class="overlay-stack" aria-hidden="true">
                <div class="grain"></div>
                <div class="scanlines"></div>
                <div class="tracking"></div>
                <div class="vignette"></div>
                <div class="flash" id="flash"></div>
            </div>
        </div>

        <header class="hud" id="hud">
            <div class="hud-group">
                <span class="hud-room" id="hud-room">RECEPTION</span>
                <span class="hud-clock" id="hud-clock">3:00 AM</span>
            </div>

            <div class="hud-group hud-right">
                <div class="nerve" id="nerve" title="Nerve">
                    <div class="nerve-fill" id="nerve-fill"></div>
                </div>
                <button class="icon-btn" id="btn-mute" type="button" aria-label="Mute sound">SOUND</button>
                <button class="icon-btn" id="btn-pause" type="button" aria-label="Pause">II</button>
            </div>
        </header>
        <div class="inventory-bar" id="inventory-bar" aria-label="Inventory"></div>
        <div class="modal-layer" id="modal-layer" hidden></div>
        <div class="debug" id="debug" hidden></div>
    
        <script src="js/util.js"></script>
        <script src="js/state.js"></script>
        <script src="js/assets.js"></script>
        <script src="js/audio.js"></script>
        <script src="js/input.js"></script>
        <script src="js/ui.js"></script>
        <script src="js/rooms.js"></script>
        <script src="js/render.js"></script>
        <script src="js/hotspots.js"></script>
        <script src="js/inventory.js"></script>
        <script src="js/notes.js"></script>
        <script src="js/puzzles.js"></script>
        <script src="js/presence.js"></script>
        <script src="js/video.js"></script>
        <script src="js/interact.js"></script>
        <script src="js/scenes.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
