<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name=""theme-color" content="#0b1210">
        <meta name="description" content="WARD 7 - a first-person horror game set in an abandoned sanatorium.">
        <title>WARD 7</title>
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/reset.css">
    </head>
    <body class="page page-title" data-page="title">
        <div class="title-bg" aria-hidden="true"></div>
        <div class="scanlines" aria-hidden="true"></div>
        <div class="vignette" aria-hidden="true"></div> 

        <main class="title-wrap">
            <p class="eyebrow">St. Aldis Sanatorium &middot; WARD 7 &middot; 1998</p>
            <h1 class="logo">
                <span class="logo-word">WARD</span><span class="logo-num">7</span>
            </h1>
            <p class="tagline">Do not use the East stairwell</p>
            <div class="name-row">
                <label class="name-label" for="player-name">Name on the chart</label>
                <input class="name-input" id="player-name" type="text" maxlength="14" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Name">
            </div>
            <nav class="menu">
                <button class="btn btn-primary" id="btn-begin" type="button">BEGIN</button>
                <button class="btn" id="btn-continue" type="button" hidden>CONTINUE</button>
                <a class="btn btn-ghost" href="help.html">How to play</a>
                <a class="btn btn-ghost" href="credits.html">Credits</a>
            </nav>
            <p class="hint">
                Headphones. Lights off.<br>
                Best played between 1&nbsp;AM and 4&nbsp;AM.
            </p>
        </main>
    </body>
</html>
